[workspace]
resolver = "3"
members = ["crates/rules", "crates/game", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
goblins_rules = { path = "crates/rules" }
goblins_server = { path = "crates/server" }
bevy = { version = "0.20.0", default-features = false, features = ["3d", "ui"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
anyhow = "1.0.104"
toml = "1.1.8"
rand_core = "0.10"
rand_chacha = "0.10.0"
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.11.0"
insta = { version = "1.49.0", features = ["json"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
schemars = "1.2.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

