# Kick-off formation of the home team, mirrored for away: each line stands `depth` columns behind
# the centre column, on the rows `across` counted from the centre row (negative: north), and its
# squares go first to the archetypes it prefers, then to any goblin left.
[[formation]]
depth = 1
across = [-1, 0, 1]
prefers = ["bruiser", "sprinter", "thrower"]

[[formation]]
depth = 3
across = [-5, -4, 4, 5]
prefers = ["sprinter", "bruiser", "thrower"]

[[formation]]
depth = 8
across = [-2, 2]
prefers = ["thrower", "bruiser", "sprinter"]

[archetypes.bruiser]
attack = 4
defense = 4
agility = 3
health = 7
movement = 4

[archetypes.sprinter]
attack = 3
defense = 2
agility = 6
health = 5
movement = 6

[archetypes.thrower]
attack = 3
defense = 3
agility = 6
health = 6
movement = 4

[roster_limits]
bruiser = { min = 0, max = 8 }
sprinter = { min = 0, max = 8 }
thrower = { min = 1, max = 2 }

[default_roster]
bruisers = 3
sprinters = 4
throwers = 2
