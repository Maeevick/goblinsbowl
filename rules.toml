    "xxxxxxxOOOOOOOxxxxxxx",
    "xxxxxOOOOOOOOOOOxxxxx",
    "xxxxOOOOOOOOOOOOOxxxx",
    "xxxOOOOOOOOOOOOOOOxxx",
    "xxOOOOOOOOOOOOOOOOOxx",
    "xOOOOOOOOOOOOOOOOOOOx",
    "xOOOOOOOOOOOOOOOOOOOx",
    "HOOOOOOOOOOOOOOOOOOOA",
    "HOOOOOOOOOOOOOOOOOOOA",
    "HOOOOOOOOOOOOOOOOOOOA",
    "HOOOOOOOOOOOOOOOOOOOA",
    "HOOOOOOOOOOOOOOOOOOOA",
    "HOOOOOOOOOOOOOOOOOOOA",
    "HOOOOOOOOOOOOOOOOOOOA",
    "xOOOOOOOOOOOOOOOOOOOx",
