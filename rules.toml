# Goblins Bowl, rules 0.1: every tunable number of a match.
# Attack, Defense and Agility are rolled as dice with that many faces.

turns_per_half = 10
halves = 2
turn_seconds = 60
team_size = 9

# A ball roll (Pick, Throw, Catch, Intercept) must reach this value after its maluses.
ball_roll_target = 2
# Orthogonal steps a throw covers before losing 1 per extra step.
throw_free_range = 6
interception_surprise_malus = 1
# Malus on the defense roll of a goblin assaulted while down.
downed_defense_malus = 2
# Squares the kick-off drops the ball into the receiving half (0: the centre square).
kickoff_depth = 0
# Most a Stance bonus adds to one roll (5: a goblin and its four neighbours, so no cap).
stance_bonus_cap = 5
# Whether a goblin keeps the steps it did not walk after its action, its Move and one action
# per turn spent over several orders (false: its first order ends its turn).
keeps_moving_after_action = false

# x out of bounds, O in bounds, H home den (west), A away den (east).
